name: Build JARVIS native apps
on:
  pull_request:
    paths:
      - 'native_app/**'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:
  push:
    paths:
      - 'native_app/**'
      - '.github/workflows/build-native.yml'
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and Windows platform folders
        run: flutter create --platforms=android,windows --project-name jarvis_companion .
      - name: Add Android microphone permission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<uses-permission android:name="android.permission.RECORD_AUDIO" /><uses-permission android:name="android.permission.INTERNET" /><application', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: native_app/build/app/outputs/flutter-apk/app-release.apk
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and Windows platform folders
        run: flutter create --platforms=android,windows --project-name jarvis_companion .
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-release
          path: native_app/build/windows/x64/runner/Release/**
